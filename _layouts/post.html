---
layout: default
---
<article class="post">
  <header>
    <h1>{{ page.title }}</h1>
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%d/%m/%Y' }}</time>
      {% if page.tags.size > 0 %} · {{ page.tags | join: ', ' }}{% endif %}
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <a class="back" href="{{ '/blog/' | relative_url }}">← Voltar para o blog</a>
</article>
